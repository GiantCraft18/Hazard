        function showAddFriendDialog() {
            const dialog = document.createElement('div');
            dialog.className = 'add-friend-dialog';
            dialog.innerHTML = `
                <div class="add-friend-container">
                    <div class="add-friend-header"><h3>Добавить друга</h3><button class="dialog-close-btn"><i class="fas fa-times"></i></button></div>
                    <div class="add-friend-content">
                        <p>Введите ID пользователя (10 символов, буквы и цифры):</p>
                        <div class="input-group">
                            <input type="text" id="friendIdInput" placeholder="Например: A1b2C3d4E5" maxlength="10">
                            <button id="sendRequestBtn"><i class="fas fa-paper-plane"></i></button>
                        </div>
                        <div class="friend-id-info"><i class="fas fa-info-circle"></i><span>ID состоит из 10 символов (буквы и цифры)</span></div>
                        <div id="friendSearchResult" style="margin-top:15px;"></div>
                    </div>
                </div>`;
            document.body.appendChild(dialog);
            setTimeout(() => dialog.classList.add('active'), 10);

            const close = () => { dialog.classList.remove('active'); setTimeout(() => dialog.remove(), 300); };
            dialog.querySelector('.dialog-close-btn').addEventListener('click', close);
            dialog.addEventListener('click', (e) => { if (e.target === dialog) close(); });

            const input = document.getElementById('friendIdInput');
            const resultDiv = document.getElementById('friendSearchResult');

            // Функция поиска пользователя по ID
            function searchUserById() {
                const friendId = input.value.trim().toUpperCase();
                resultDiv.innerHTML = '';

                if (!friendId) {
                    resultDiv.innerHTML = '<div style="color:#ff4444;font-size:0.9rem;">Введите ID пользователя</div>';
                    return;
                }

                if (friendId.length !== 10) {
                    resultDiv.innerHTML = '<div style="color:#ff4444;font-size:0.9rem;">ID должен состоять из 10 символов</div>';
                    return;
                }

                if (friendId === currentUser.id) {
                    resultDiv.innerHTML = '<div style="color:#ff4444;font-size:0.9rem;">Нельзя добавить себя в контакты</div>';
                    return;
                }

                // Ищем пользователя в allRegisteredUsers
                const targetUser = allRegisteredUsers.find(u => u.id === friendId);

                if (!targetUser) {
                    resultDiv.innerHTML = '<div style="color:#ff4444;font-size:0.9rem;">Пользователь с таким ID не найден</div>';
                    return;
                }

                // Проверяем, не в контактах ли уже
                const existingContact = contacts.find(c => c.userId === friendId);
                if (existingContact) {
                    resultDiv.innerHTML = `<div style="color:var(--hazard-yellow);font-size:0.9rem;">Пользователь уже в контактах</div>`;
                    return;
                }

                // Показываем найденного пользователя
                resultDiv.innerHTML = `
                    <div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg-light);border-radius:8px;border:1px solid var(--hazard-yellow);">
                        <img src="${targetUser.avatar || 'https://i.pravatar.cc/150'}" style="width:50px;height:50px;border-radius:50%;border:2px solid var(--hazard-yellow);object-fit:cover;">
                        <div style="flex:1;">
                            <div style="font-weight:bold;color:var(--text-light);">${targetUser.name}</div>
                            <div style="font-size:0.8rem;color:var(--text-dim);">${targetUser.status || 'Нет статуса'}</div>
                            <div style="font-size:0.7rem;color:var(--text-dim);font-family:var(--font-mono);">ID: ${targetUser.id}</div>
                        </div>
                        <button id="confirmAddFriendBtn" style="background:var(--hazard-yellow);color:var(--bg-dark);border:none;padding:8px 16px;border-radius:6px;font-family:var(--font-header);cursor:pointer;transition:all 0.2s;">
                            <i class="fas fa-plus"></i> Добавить
                        </button>
                    </div>`;

                // Обработчик кнопки "Добавить"
                document.getElementById('confirmAddFriendBtn').addEventListener('click', () => {
                    // Добавляем в контакты
                    const newContact = {
                        id: `contact-${Date.now()}`,
                        name: targetUser.name,
                        type: 'private',
                        userId: targetUser.id,
                        avatar: targetUser.avatar,
                        icon: 'fa-user',
                        isOnline: false,
                        category: 'personal'
                    };
                    contacts.push(newContact);
                    localStorage.setItem('cpContacts', JSON.stringify(contacts));
                    renderChatList();
                    close();
                    showNotification(`${targetUser.name} добавлен в контакты`);
                });
            }

            // Поиск при вводе
            input.addEventListener('input', () => {
                clearTimeout(input._searchTimeout);
                input._searchTimeout = setTimeout(searchUserById, 300);
            });

            // Поиск при нажатии кнопки
            document.getElementById('sendRequestBtn').addEventListener('click', searchUserById);

            // Поиск при Enter
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchUserById();
            });

            // Автофокус
            input.focus();
        }

                                ${isMemberCreator ? '<span class="role-badge creator">СОЗДАТЕЛЬ</span>' : ''}
                                ${isMemberAdmin && !isMemberCreator ? '<span class="role-badge admin">АДМИН</span>' : ''}
                                ${!isMemberAdmin ? '<span class="role-badge member">УЧАСТНИК</span>' : ''}
                            </div>
                        </div>
                        ${isAdmin && memberId !== currentUser.id ? `
                            <div class="group-member-item-actions">
                                ${isMemberAdmin && !isMemberCreator ? `<button class="member-action-btn remove-admin" data-user-id="${memberId}"><i class="fas fa-user-minus"></i></button>` : ''}
                                ${!isMemberAdmin ? `<button class="member-action-btn make-admin" data-user-id="${memberId}"><i class="fas fa-user-plus"></i></button>` : ''}
                                <button class="member-action-btn remove-member" data-user-id="${memberId}"><i class="fas fa-user-times"></i></button>
                            </div>` : ''}
                    </div>`;
            });

            document.getElementById('editGroupPageContent').innerHTML = `
                <div class="edit-group-layout">
                    <div class="edit-group-header-section">
                        <div class="edit-group-avatar-container">
                            <div class="edit-group-avatar">
                                ${group.avatar ? `<img src="${group.avatar}" alt="${group.name}">` : `<i class="fas ${group.icon || 'fa-users'}"></i>`}
                                ${isAdmin ? `<label for="groupAvatarInput" class="edit-group-avatar-change"><i class="fas fa-camera"></i></label><input type="file" id="groupAvatarInput" accept="image/*" style="display:none;">` : ''}
                            </div>
                        </div>
                        ${isAdmin ? `
                            <input type="text" class="profile-edit-field" id="editGroupNameInput" placeholder="Название" value="${group.name}">
                            <textarea class="profile-edit-field" id="editGroupDescriptionInput" placeholder="Описание" rows="3">${group.description || ''}</textarea>
                        ` : `
                            <div class="group-info-display">
                                <div class="info-item"><span class="info-label">Название:</span><span class="info-value">${group.name}</span></div>
                                <div class="info-item"><span class="info-label">Описание:</span><span class="info-value">${group.description || 'Нет описания'}</span></div>
                                <div class="info-item"><span class="info-label">Создана:</span><span class="info-value">${new Date(group.createdAt).toLocaleDateString()}</span></div>
                                <div class="info-item"><span class="info-label">Ваша роль:</span><span class="info-value">${isCreator ? 'СОЗДАТЕЛЬ' : (isAdmin ? 'АДМИН' : 'УЧАСТНИК')}</span></div>
                            </div>
                        `}
                    </div>
                    <div class="edit-group-members-section">
                        <div class="settings-group-title">${isChannel ? 'Подписчики' : 'Участники'} (${(group.members || []).length})</div>
                        <div class="group-members-list">${membersHtml}</div>
                    </div>
                    ${isAdmin ? `
                        <div class="edit-group-admin-section">
                            <div class="settings-group-title">Управление</div>
                            <div class="admin-controls-section">
                                <button class="admin-action-btn" id="addMemberBtn"><i class="fas fa-user-plus"></i> Добавить ${isChannel ? 'подписчика' : 'участника'}</button>
                                <button class="admin-action-btn" id="manageAdminsBtn"><i class="fas fa-user-shield"></i> Администраторы</button>
                                ${isCreator ? `<button class="admin-action-btn danger" id="deleteGroupBtn"><i class="fas fa-trash"></i> Удалить ${isChannel ? 'канал' : 'группу'}</button>` : ''}
                            </div>
                            <button class="save-profile-button" id="saveGroupButton">СОХРАНИТЬ</button>
                        </div>
                    ` : ''}
                </div>`;

            if (isAdmin) {
                document.getElementById('groupAvatarInput')?.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file && file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (ev) => { group.avatar = ev.target.result; localStorage.setItem('cpContacts', JSON.stringify(contacts)); renderEditGroupPage(groupId); renderChatList(); };
                        reader.readAsDataURL(file);
                    }
                });
                document.getElementById('saveGroupButton').addEventListener('click', () => {
                    group.name = document.getElementById('editGroupNameInput').value;
                    group.description = document.getElementById('editGroupDescriptionInput').value;
                    localStorage.setItem('cpContacts', JSON.stringify(contacts));
                    renderChatList();
                    openChat(groupId);
                });
                document.getElementById('deleteGroupBtn')?.addEventListener('click', () => { if (confirm(`Удалить "${group.name}"?`)) deleteChat(groupId); });
                document.getElementById('addMemberBtn')?.addEventListener('click', () => showAddMemberDialog(groupId));
                document.getElementById('manageAdminsBtn')?.addEventListener('click', () => showManageAdminsDialog(groupId));
                document.querySelectorAll('.make-admin').forEach(btn => btn.addEventListener('click', (e) => {
                    const uid = e.currentTarget.dataset.userId;
                    if (!group.admins) group.admins = [currentUser.id];
                    if (!group.admins.includes(uid)) group.admins.push(uid);
                    localStorage.setItem('cpContacts', JSON.stringify(contacts));
                    renderEditGroupPage(groupId);
                    showNotification('Назначен администратором');
                }));
                document.querySelectorAll('.remove-admin').forEach(btn => btn.addEventListener('click', (e) => {
                    const uid = e.currentTarget.dataset.userId;
                    if (group.admins.length <= 1) { alert('Нельзя удалить последнего администратора'); return; }
                    group.admins = group.admins.filter(id => id !== uid);
                    localStorage.setItem('cpContacts', JSON.stringify(contacts));
                    renderEditGroupPage(groupId);
                    showNotification('Снят с администраторов');
                }));
                document.querySelectorAll('.remove-member').forEach(btn => btn.addEventListener('click', (e) => {
                    const uid = e.currentTarget.dataset.userId;
                    if (confirm('Удалить участника?')) {
                        group.members = group.members.filter(id => id !== uid);
                        if (group.admins) group.admins = group.admins.filter(id => id !== uid);
                        localStorage.setItem('cpContacts', JSON.stringify(contacts));
                        renderEditGroupPage(groupId);
                        renderChatList();
                    }
                }));
            }
        }

        function showAddMemberDialog(groupId) {
            const group = contacts.find(c => c.id === groupId);
            if (!group) return;
            const available = allRegisteredUsers.filter(u => !group.members.includes(u.id) && u.id !== currentUser.id);
            if (available.length === 0) { alert('Нет доступных пользователей'); return; }
            const dialog = document.createElement('div');
            dialog.className = 'add-member-dialog';
            dialog.innerHTML = `
                <div class="add-member-container">
                    <div class="add-member-header"><h3>Добавить в "${group.name}"</h3><button class="dialog-close-btn"><i class="fas fa-times"></i></button></div>
                    <div class="available-users-list">
                        ${available.map(u => `
                            <div class="available-user-item">
                                <div class="available-user-avatar"><img src="${u.avatar || 'https://i.pravatar.cc/150'}" alt="${u.name}"></div>
                                <div class="available-user-info"><div class="available-user-name">${u.name}</div></div>
                                <button class="add-user-btn" data-user-id="${u.id}"><i class="fas fa-plus"></i></button>
                            </div>`).join('')}
                    </div>
                </div>`;
            document.body.appendChild(dialog);
            setTimeout(() => dialog.classList.add('active'), 10);
            dialog.querySelector('.dialog-close-btn').addEventListener('click', () => { dialog.classList.remove('active'); setTimeout(() => dialog.remove(), 300); });
            dialog.querySelectorAll('.add-user-btn').forEach(btn => btn.addEventListener('click', (e) => {
                const uid = e.currentTarget.dataset.userId;
                group.members.push(uid);
                localStorage.setItem('cpContacts', JSON.stringify(contacts));
                dialog.remove();
                renderEditGroupPage(groupId);
                renderChatList();
                showNotification('Участник добавлен');
            }));
        }

        function showManageAdminsDialog(groupId) {
            const group = contacts.find(c => c.id === groupId);
            if (!group) return;
            const admins = group.admins || [];
            const dialog = document.createElement('div');
            dialog.className = 'manage-admins-dialog';
            dialog.innerHTML = `
                <div class="manage-admins-container">
                    <div class="manage-admins-header"><h3>Администраторы</h3><button class="dialog-close-btn"><i class="fas fa-times"></i></button></div>
                    <div class="admins-section"><h4>Текущие:</h4>${admins.map(aid => {
                        const u = allRegisteredUsers.find(x => x.id === aid);
                        if (!u) return '';
                        return `<div class="admin-item"><div class="admin-avatar"><img src="${u.avatar || 'https://i.pravatar.cc/150'}"></div><div class="admin-info"><div class="admin-name">${u.name}</div></div></div>`;
                    }).join('')}</div>
                    <div class="potential-admins-section"><h4>Сделать админом:</h4>${group.members.filter(m => !admins.includes(m) && m !== currentUser.id).map(mid => {
                        const u = allRegisteredUsers.find(x => x.id === mid);
                        if (!u) return '';
                        return `<div class="potential-admin-item"><div class="potential-admin-avatar"><img src="${u.avatar || 'https://i.pravatar.cc/150'}"></div><div class="potential-admin-info"><div class="potential-admin-name">${u.name}</div></div><button class="make-admin-btn" data-user-id="${mid}"><i class="fas fa-user-plus"></i></button></div>`;
                    }).join('')}</div>
                </div>`;
            document.body.appendChild(dialog);
            setTimeout(() => dialog.classList.add('active'), 10);
            dialog.querySelector('.dialog-close-btn').addEventListener('click', () => { dialog.classList.remove('active'); setTimeout(() => dialog.remove(), 300); });
            dialog.querySelectorAll('.make-admin-btn').forEach(btn => btn.addEventListener('click', (e) => {
                const uid = e.currentTarget.dataset.userId;
                if (!group.admins) group.admins = [currentUser.id];
                if (!group.admins.includes(uid)) group.admins.push(uid);
                localStorage.setItem('cpContacts', JSON.stringify(contacts));
                dialog.remove();
                renderEditGroupPage(groupId);
                showNotification('Назначен администратором');
            }));
        }

        // --- НАСТРОЙКИ ---
        function renderSettingsPage() {
            const content = document.getElementById('settingsPageContent');
            const theme = localStorage.getItem('cpTheme') || 'dark';
            content.innerHTML = `
                <div class="settings-group">
                    <div class="settings-group-title">Аккаунт</div>
                    <div class="settings-item"><span>ID: ${currentUser.id}</span><button class="copy-id-btn" data-id="${currentUser.id}"><i class="fas fa-copy"></i></button></div>
                    <div class="settings-item"><span>Выйти</span><button class="logout-btn"><i class="fas fa-sign-out-alt"></i></button></div>
                </div>
                <div class="settings-group">
                    <div class="settings-group-title">Внешний вид</div>
                    <div class="settings-item"><span>Тёмная тема</span><div class="toggle-switch ${theme === 'dark' ? 'active' : ''}" id="themeToggle"><div class="toggle-switch-slider"></div></div></div>
                </div>
                <div class="settings-group">
                    <div class="settings-group-title">Уведомления</div>
                    <div class="settings-item"><span>Уведомления</span><div class="toggle-switch active" data-setting="notifications"><div class="toggle-switch-slider"></div></div></div>
                    <div class="settings-item"><span>Звук</span><div class="toggle-switch active" data-setting="sound"><div class="toggle-switch-slider"></div></div></div>
                </div>
                <div class="settings-group">
                    <div class="settings-group-title">Данные</div>
                    <div class="settings-item"><span>Очистить кэш</span><i class="fas fa-broom" style="color:var(--text-dim);cursor:pointer;" id="clearCacheBtn"></i></div>
                </div>`;
            document.querySelector('.copy-id-btn').addEventListener('click', (e) => {
                navigator.clipboard.writeText(e.currentTarget.dataset.id).then(() => alert('ID скопирован'));
            });
            document.querySelector('.logout-btn').addEventListener('click', () => {
                if (confirm('Выйти?')) { localStorage.removeItem('cpCurrentUser'); location.reload(); }
            });
            document.getElementById('themeToggle').addEventListener('click', function() {
                this.classList.toggle('active');
                const newTheme = this.classList.contains('active') ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('cpTheme', newTheme);
            });
            document.querySelectorAll('.toggle-switch[data-setting]').forEach(t => {
                t.addEventListener('click', function() { this.classList.toggle('active'); localStorage.setItem(`cp_${this.dataset.setting}`, this.classList.contains('active')); });
            });
            document.getElementById('clearCacheBtn').addEventListener('click', () => { if (confirm('Очистить кэш?')) { localStorage.clear(); location.reload(); } });
        }

        // --- ЗВОНКИ ---
        function renderCallsPage() {
            document.getElementById('callsPageContent').innerHTML = `
                <div class="chat-list-item"><div class="chat-list-item-avatar"><i class="fas fa-phone" style="font-size:1.5rem;"></i></div><div class="chat-list-item-info"><div class="chat-list-item-name">История звонков</div><div class="chat-list-item-last-message">Нет недавних звонков</div></div></div>`;
        }

        // --- ОБНОВЛЕНИЯ ---
        function renderUpdatesPage() {
            document.getElementById('updatesPageContent').innerHTML = `
                <div class="updates-container">
                    <div class="updates-section">
                        <div class="updates-title">Реализовано</div>
                        <ul class="updates-list">
                            <li class="updates-list-item"><i class="fas fa-check-circle"></i><div><div class="updates-list-item-title">Поиск по ID</div><div class="updates-list-item-description">Добавление друзей по уникальному ID</div></div></li>
                            <li class="updates-list-item"><i class="fas fa-check-circle"></i><div><div class="updates-list-item-title">Группы и каналы</div><div class="updates-list-item-description">Создание и управление</div></div></li>
                            <li class="updates-list-item"><i class="fas fa-check-circle"></i><div><div class="updates-list-item-title">Передача файлов</div><div class="updates-list-item-description">Обмен файлами</div></div></li>
                        </ul>
                    </div>
                </div>`;
        }

        // --- О ПРОГРАММЕ ---
        function renderAboutPage() {
            document.getElementById('aboutPageContent').innerHTML = `
                <div class="about-container">
                    <div class="about-header">
                        <div class="about-logo"><i class="fas fa-biohazard"></i></div>
                        <div class="about-title">ПРОТОКОЛ КОНТЕЙНМЕНТА</div>
                        <div class="about-version">Версия 3.0.0</div>
                    </div>
                    <div class="about-description">CP-Messenger — защищённая система обмена сообщениями с поддержкой групп, каналов и файлов.</div>
                    <div class="about-tabs">
                        <button class="about-tab active" data-tab="policy">Политика</button>
                        <button class="about-tab" data-tab="faq">Вопросы</button>
                        <button class="about-tab" data-tab="contact">Связь</button>
                    </div>
                    <div class="about-tab-content active" id="policy-tab"><p>Мы не храним ваши сообщения. Всё шифруется.</p></div>
                    <div class="about-tab-content" id="faq-tab"><p>FAQ: Всё работает локально.</p></div>
                    <div class="about-tab-content" id="contact-tab"><p>support@cp-messenger.sec</p></div>
                </div>`;
            document.querySelectorAll('.about-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.about-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.querySelectorAll('.about-tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById(`${tab.dataset.tab}-tab`).classList.add('active');
                });
            });
        }

        // --- ОБРАБОТЧИКИ ---
        hamburgerMenu.addEventListener('click', () => mainSidebar.classList.toggle('open'));
        backToChatList.addEventListener('click', () => showView('chat-list'));
        profileButton.addEventListener('click', () => { renderProfilePage(); showView('profile'); });
        backFromProfile.addEventListener('click', () => showView(isMobile() ? 'chat-list' : 'chat'));
        backFromSettings.addEventListener('click', () => showView(isMobile() ? 'chat-list' : 'chat'));
        backFromContacts.addEventListener('click', () => showView(isMobile() ? 'chat-list' : 'chat'));
        backFromCalls.addEventListener('click', () => showView(isMobile() ? 'chat-list' : 'chat'));
        backFromContactProfile.addEventListener('click', () => showView('chat'));
        backFromEditGroup.addEventListener('click', () => showView('chat'));
        backFromCreateGroup.addEventListener('click', () => showView('contacts'));
        backFromCreateChannel.addEventListener('click', () => showView('chat-list'));
        backFromUpdates.addEventListener('click', () => showView(isMobile() ? 'chat-list' : 'chat'));
        backFromAbout.addEventListener('click', () => showView(isMobile() ? 'chat-list' : 'chat'));

        sendButton.addEventListener('click', async () => {
            const text = messageInput.value.trim();
            if (text || attachedFile) {
                await addMessage(text, 'sent', activeChatId, attachedFile);
                messageInput.value = '';
                if (attachedFile) { attachedFile = null; fileStatus.classList.remove('has-file'); fileInput.value = ''; }
            }
        });

        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendButton.click(); });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                let fileData = null, previewSrc = null;
                if (file.type.startsWith('image/')) {
                    previewSrc = await new Promise(res => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(file); });
                    fileData = previewSrc;
                } else if (file.size < 5 * 1024 * 1024) {
                    fileData = await new Promise(res => { const r = new FileReader(); r.onload = ev => res(ev.target.result); r.readAsDataURL(file); });
                }
                attachedFile = { name: file.name, size: (file.size / 1024).toFixed(2) + ' KB', type: file.type, data: fileData, preview: previewSrc };
                fileNameDisplay.textContent = file.name;
                fileStatus.classList.add('has-file');
            }
        });

        removeBtn.addEventListener('click', () => { attachedFile = null; fileStatus.classList.remove('has-file'); fileInput.value = ''; });
        replyBarClose.addEventListener('click', () => { replyingTo = null; replyBar.classList.remove('active'); });

        searchBox.addEventListener('input', (e) => renderChatList(e.target.value));

        clearChatButton.addEventListener('click', () => {
            if (confirm('Очистить историю?')) {
                messageStorage.saveMessages(activeChatId, []);
                delete pinnedMessages[activeChatId];
                localStorage.setItem('cpPinnedMessages', JSON.stringify(pinnedMessages));
                loadMessages(activeChatId);
                showNotification('История очищена');
            }
        });

        function loadTheme() {
            const theme = localStorage.getItem('cpTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        }

        // --- СТАРТ ---
        if (!currentUser) showLoginScreen();
        else initApp();
    });
</script>
</body>
</html>
